name: TMG Price Bot
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: write
jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4 lxml curl_cffi python-amazon-paapi
      - name: Run price bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
        run: python bot.py
      - name: Keep-alive commit (prevents GitHub auto-disable after 60 days of inactivity)
        run: |
          echo "last run: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos.json estado.json last-run.txt precios.json 2>/dev/null || git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync bot state (heartbeat)"
            git push
          fi
